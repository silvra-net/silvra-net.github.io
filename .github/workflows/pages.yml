# Builds the site and publishes it to GitHub Pages at silvra.net.
#
# The repository used to hold a hand-copied `dist` with no source beside it; this workflow is
# what makes the built output a consequence of the source rather than a thing someone remembers
# to upload.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a superseded build has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Pages has no index.html fallback of its own: /mission exists only in the browser, so a
      # hard refresh asks for a file that was never built. 404.html is what Pages serves in that
      # case, and an identical copy of the app hands the request to the client router.
      # Note this also makes real 404s render the app's NotFound page, which is the intent.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
