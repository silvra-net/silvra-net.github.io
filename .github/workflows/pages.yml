# Builds the site and publishes it to GitHub Pages at silvra.net.
#
# The repository used to hold a hand-copied `dist` with no source beside it; this workflow is
# what makes the built output a consequence of the source rather than a thing someone remembers
# to upload.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # security.txt is written with an expiry a year after the build (scripts/prerender.mjs), so a
  # monthly rebuild keeps it well inside that year even when nothing else changes. GitHub pauses
  # schedules in a repository without activity for 60 days; the footer year no longer depends on
  # this (it reads the visitor's clock), but the expiry does, so a paused schedule needs a re-enable.
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a superseded build has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Guards the two failures this rebuild actually hit: a key present in one language only,
      # and a component asking for a path the dictionary does not have — both of which render
      # as a raw dotted path on the page rather than failing loudly.
      - run: npm test

      # `npm run build` ends in scripts/prerender.mjs, which writes a directory per route and
      # the 404.html fallback — so this runs the same way here as it does locally.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
