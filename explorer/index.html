<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Helix Explorer moved</title>
    <link rel="canonical" href="https://explorer.silvra.net/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://explorer.silvra.net/" />
    <script>
      // The header link in the site bundle still points at /explorer/. This page keeps that
      // link working until the site is rebuilt with the new address; the meta refresh above
      // is what does the work if scripting is off.
      location.replace("https://explorer.silvra.net/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>The Helix Explorer now lives at
      <a href="https://explorer.silvra.net/">explorer.silvra.net</a>.</p>
  </body>
</html>
