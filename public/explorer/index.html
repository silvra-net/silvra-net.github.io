<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Explorer — verschoben</title>
    <link rel="canonical" href="https://explorer.silvra.net/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://explorer.silvra.net/" />
    <script>
      // The explorer has its own host now. This keeps every link that still says /explorer
      // working — including the one baked into the old site bundle.
      location.replace("https://explorer.silvra.net/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Der Helix Explorer liegt jetzt unter
      <a href="https://explorer.silvra.net/">explorer.silvra.net</a>.</p>
  </body>
</html>
