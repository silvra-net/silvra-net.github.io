    <meta
      name="description"
      content="Block explorer for Helix (HLX), a post-quantum Layer-1 blockchain. Blocks, transactions, accounts, validators and the commit certificate behind every block."
    />
    <script>
      // Applied before first paint so the page never flashes the wrong theme. Mirrors
      // src/theme.ts — an explicit choice wins over the OS preference in both directions.
      try {
        var t = localStorage.getItem("helix-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* private mode: fall through to the OS preference */
      }
    </script>
