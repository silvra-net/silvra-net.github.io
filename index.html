<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0a0c09" />
    <meta
      name="description"
      content="Silvra entwickelt in der EU post-quanten-sichere Technologie: den Silvra Messenger mit Ende-zu-Ende-Verschlüsselung und Helix, eine Layer-1-Blockchain mit ML-DSA-65."
    />
    <title>Silvra — Digitale Infrastruktur aus Europa</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme. Mirrors
      // src/theme.ts — an explicit choice wins over the OS preference in both directions.
      try {
        var t = localStorage.getItem("silvra-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* private mode: fall through to the OS preference */
      }
      // The same for motion (src/lib/motion.ts): the page's own switch, or else the OS setting.
      try {
        var m = localStorage.getItem("silvra-motion");
        var still = m ? m === "still" : window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        document.documentElement.setAttribute("data-motion", still ? "still" : "moving");
      } catch (e) {
        /* private mode: CSS still follows the OS setting through its media queries */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
