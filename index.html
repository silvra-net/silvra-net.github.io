<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Silvra — Zukunftssichere Software aus Europa</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme. Mirrors
      // src/theme.ts — an explicit choice wins over the OS preference in both directions.
      try {
        var t = localStorage.getItem("silvra-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* private mode: fall through to the OS preference */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
