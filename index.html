<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icons/icon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c09" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f3" />
    <meta
      name="description"
      content="Silvra entwickelt in der EU Technologie mit Post-Quanten-Kryptographie: den Silvra Messenger mit Ende-zu-Ende-Verschlüsselung und Helix, eine Layer-1-Blockchain mit ML-DSA-65."
    />
    <title>Silvra – Digitale Infrastruktur aus Europa</title>
    <script>
      // Marks the page as scripted before first paint. Reveals and dimmed words are hidden only
      // under this class, so a visitor without JavaScript reads every word at once.
      document.documentElement.classList.add("js");
      // Applied before first paint so the page never flashes the wrong theme. Mirrors
      // src/theme.ts — an explicit choice wins over the OS preference in both directions.
      // The browser bar follows the same choice; the two metas above only know the OS setting.
      try {
        var t = localStorage.getItem("silvra-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (el) {
            el.setAttribute("content", t === "light" ? "#f7f7f3" : "#0a0c09");
          });
        }
      } catch (e) {
        /* private mode: fall through to the OS preference */
      }
      // The same for motion (src/lib/motion.ts): the page's own switch, or else the OS setting.
      // data-motion is what the stylesheet follows, so it is set even when storage is blocked.
      var m = null;
      try {
        m = localStorage.getItem("silvra-motion");
      } catch (e) {
        /* private mode: no stored choice, so the OS setting decides */
      }
      var still = m ? m === "still" : window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.documentElement.setAttribute("data-motion", still ? "still" : "moving");
    </script>
    <noscript>
      <style>
        /* Reveals and dimmed words need nothing here: they are hidden only under .js, which no
           script has set. Without the script nothing marks the bars solid once the page scrolls, and transparent
           bars would sit on top of the text. */
        .site-header,
        .section-nav {
          background: var(--bg);
          border-bottom-color: var(--line);
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
